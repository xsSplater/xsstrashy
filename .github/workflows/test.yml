name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet -unsafeptr=false ./...
      - name: go test
        # Отключаем -race для Windows, так как checkptr конфликтует с syscall COM
        run: go test -v ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: compile for all supported platforms
        run: |
          GOOS=linux   GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=amd64 go build ./...